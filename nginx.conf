server {
  listen 8083;
  server_name localhost;

  root /kopparthi_jashwanth_ui_garden;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Cache the fingerprinted static assets produced by react-scripts
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
